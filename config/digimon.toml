# Recompiler input for opens4ka-digimon-default.xbe, written by xbe_symbols

[xbe]
path = "assets/default.xbe"
title = 0x42410001
entry = 0x1268D8
xdk = 5849  # built with 5788, whose library matches the 5849 layout (as the USA image)
out = "generated/digimon"
partitions = 64
code_sections = [".text", "D3D", "D3DX", "XGRPH", "DSOUND", "XPP"]

# extra entry points
[functions]
0x1E8AAE = "fn_1E8AAE"  # indirect callback observed during boot
0x91C50 = "fn_91C50"  # vtable slot the attract demo calls loading final_toytown (USA 0x92500)

